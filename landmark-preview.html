<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Landmark preview</title>
  <style>
    body { margin: 0; background: #070b18; color: #9fd7ff; font: 13px sans-serif; }
    #status { padding: 6px 10px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="status">link test…</div>
  <canvas id="c" width="1440" height="1120"></canvas>
  <script type="module">
    import {
      drawClaimBeacon, drawFluxCore, drawRiftGate, drawStasisStructure,
      drawLandmarkBoundary, drawRiftArrivals,
    } from './src/render/StrategicLandmarkRenderer.js';
    import { CLAIM_BEACON, FLUX_CORE, RIFT, STASIS, CREATURE } from './src/config.js';

    const status = document.getElementById('status');
    import('./src/core/Game.js')
      .then(() => { status.textContent = 'GAME IMPORT: OK'; })
      .catch((e) => { status.textContent = 'GAME IMPORT: ' + e.message; });

    const ctx = document.getElementById('c').getContext('2d');
    const S = 1;
    // Landmark fixtures: (kind, state, claim)
    const stations = [
      { x: 380, y: 340, lm: { x: 380, y: 340, active: true, claimT: 1, claimPulse: 0, ownerSlot: 1, ownerRgb: [90, 220, 200], seed: 11 }, radius: CLAIM_BEACON.CLAIM_RADIUS, label: 'CLAIM BEACON — claimed', draw: drawClaimBeacon, hue: CLAIM_BEACON.HUE },
      { x: 1060, y: 340, lm: { x: 1060, y: 340, active: true, claimT: 0, claimPulse: 0, ownerSlot: 0, seed: 22 }, radius: FLUX_CORE.CLAIM_RADIUS, label: 'FLUX CORE — active', draw: drawFluxCore, hue: FLUX_CORE.HUE },
      { x: 380, y: 800, lm: { x: 380, y: 800, active: true, claimT: 0, claimPulse: 0, ownerSlot: 0, seed: 33, chargeT: 0.35, charging: { x: 500, y: 850 }, enterFx: 0, arrivals: [{ x: 730, y: 1030, t: 0.28 }] }, radius: RIFT.CLAIM_RADIUS, label: 'RIFT GATE — open + charging', draw: drawRiftGate, hue: RIFT.HUE },
      { x: 1060, y: 800, lm: { x: 1060, y: 800, active: false, claimT: 0, claimPulse: 0, ownerSlot: 0, seed: 44 }, radius: STASIS.CLAIM_RADIUS, label: 'STASIS — cooldown', draw: drawStasisStructure, hue: STASIS.HUE },
    ];

    function creatureGlimpse(x, y, hue) {
      // Scale reference: one normal character beside the structure.
      ctx.beginPath();
      ctx.arc(x, y, CREATURE.RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${hue}, 70%, 55%)`;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(2,4,10,0.9)';
      ctx.stroke();
    }

    let time = 0;
    function frame(now) {
      time = now / 1000;
      // claim pulse demo on the beacon
      stations[0].lm.claimPulse = Math.max(0, 1 - ((time % 4) / 0.9));
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#0b1224';
      ctx.fillRect(0, 0, 1440, 1120);
      // subtle floor pools like the arena
      for (let i = 0; i < 6; i++) {
        const g = ctx.createRadialGradient((i % 3) * 500 + 200, Math.floor(i / 3) * 560 + 250, 0,
          (i % 3) * 500 + 200, Math.floor(i / 3) * 560 + 250, 420);
        g.addColorStop(0, 'rgba(255,255,255,0.05)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 1440, 1120);
      }
      for (const st of stations) {
        st.draw(ctx, st.lm, time);
        drawLandmarkBoundary(ctx, st.lm, time, st.radius);
        creatureGlimpse(st.x + 150, st.y + 60, st.hue);
        ctx.textAlign = 'center';
        ctx.font = '700 15px sans-serif';
        ctx.fillStyle = 'rgba(160, 220, 255, 0.9)';
        ctx.fillText(st.label, st.x, st.y + 150);
      }
      drawRiftArrivals(ctx, [{ arrivals: stations[2].lm.arrivals, x: 0, y: 0 }], null);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
